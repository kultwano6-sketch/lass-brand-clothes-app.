name = "lass-brand-clothes-app"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets (Vite React SPA)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Persistent KV Storage for Orders (Free Plan)
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "b874fd0a49a849fb94922f46080e1509"

# Public Non-Secret Environment Variables
[vars]
PAYFAST_MERCHANT_ID = "37582031"
PAYFAST_MERCHANT_KEY = "afmuiphiwjsed"
PAYFAST_PASSPHRASE = "HARVEST-kE_LAS2"
# PayFast Live Production Mode enabled (https://www.payfast.co.za)
PAYFAST_SANDBOX = "false"
ALLOW_SANDBOX_SIMULATION = "false"
APP_URL = "https://lass-brand-clothes-app.harvestkelass.workers.dev"
# In Cloudflare, secrets like PAYFAST_PASSPHRASE can also be managed via Cloudflare dashboard or wrangler secret put.
