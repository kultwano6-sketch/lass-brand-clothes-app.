name = "lass-brand-clothes-app"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets (Vite React SPA)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Persistent KV Storage for Orders (Free Plan)
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "b874fd0a49a849fb94922f46080e1509"

# Public Non-Secret Environment Variables
[vars]
# In production set to "false" to connect to live PayFast (https://www.payfast.co.za)
PAYFAST_SANDBOX = "true"
# Security requirement: simulation strictly disabled by default
ALLOW_SANDBOX_SIMULATION = "false"
APP_URL = "https://lass-brand-clothes-app.harvestkelass.workers.dev"

# Required Secrets declared for Cloudflare sync validation
# Values are stored encrypted in Cloudflare Worker Secrets (never committed to Git)
[secrets]
required = ["PAYFAST_PASSPHRASE"]
