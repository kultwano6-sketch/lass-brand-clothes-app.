<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c1b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="75%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Full-bleed background for Android Adaptive masking -->
  <rect width="512" height="512" fill="url(#bgGradFull)"/>

  <!-- Subtle ambient decorative rings in background -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#orangeGrad)" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Central safe-zone content scaled to fit within radius 180 (centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)">
    <!-- Geometric Monogram Emblem (L) -->
    <g transform="translate(256, 172)" filter="url(#dropShadow)">
      <polygon points="0,-82 72,-40 72,43 0,85 -72,43 -72,-40" fill="#09090b" stroke="url(#orangeGrad)" stroke-width="4" opacity="0.95"/>
      <polygon points="0,-70 60,-35 60,37 0,72 -60,37 -60,-35" fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5" opacity="0.6"/>
      <path d="M-26,-46 L-6,-46 L-6,20 L30,20 L30,38 L-26,38 Z" fill="#ffffff"/>
      <path d="M-22,-42 L-10,-42 L-10,24 L28,24 L28,34 L-22,34 Z" fill="url(#orangeGrad)" opacity="0.85"/>
    </g>

    <!-- Bold Typography: LASS -->
    <g fill="#ffffff" font-family="'Syne', 'Impact', 'Arial Black', sans-serif" font-weight="900" filter="url(#dropShadow)">
      <text x="256" y="322" font-size="84" text-anchor="middle" letter-spacing="10">LASS</text>
    </g>

    <!-- Tagline: HARVEST KE LASS -->
    <g fill="url(#orangeGrad)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800">
      <text x="256" y="368" font-size="19" text-anchor="middle" letter-spacing="5">HARVEST KE LASS</text>
    </g>

    <!-- Pill Badge: KASI STREETWEAR • ZA -->
    <g filter="url(#dropShadow)">
      <rect x="142" y="396" width="228" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="256" y="417" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="3" fill="#38bdf8">KASI STREETWEAR • ZA</text>
    </g>
  </g>
</svg>