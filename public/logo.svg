<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c1b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="75%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Subtle Texture Filter / Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner High-Fashion Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="url(#orangeGrad)" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Subtle Streetwear Corner Geometric Marks -->
  <circle cx="425" cy="85" r="14" fill="url(#orangeGrad)" filter="url(#dropShadow)"/>
  <circle cx="390" cy="85" r="7" fill="url(#blueGrad)"/>
  <circle cx="85" cy="425" r="5" fill="#34d399" opacity="0.7"/>

  <!-- Central Shield / Monogram Emblem (L) -->
  <g transform="translate(256, 175)" filter="url(#dropShadow)">
    <!-- Emblem Background Badge -->
    <polygon points="0,-85 75,-42 75,45 0,88 -75,45 -75,-42" fill="#09090b" stroke="url(#orangeGrad)" stroke-width="4" opacity="0.95"/>
    <polygon points="0,-74 65,-37 65,39 0,76 -65,39 -65,-37" fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Stylized Geometric 'L' -->
    <path d="M-28,-48 L-8,-48 L-8,22 L32,22 L32,40 L-28,40 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M-24,-44 L-12,-44 L-12,26 L30,26 L30,36 L-24,36 Z" fill="url(#orangeGrad)" opacity="0.85"/>
  </g>

  <!-- Bold Typography: LASS -->
  <g fill="#ffffff" font-family="'Syne', 'Impact', 'Arial Black', sans-serif" font-weight="900" filter="url(#dropShadow)">
    <text x="256" y="326" font-size="88" text-anchor="middle" letter-spacing="10">LASS</text>
  </g>

  <!-- Tagline: HARVEST KE LASS in Vibrant Orange -->
  <g fill="url(#orangeGrad)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800">
    <text x="256" y="374" font-size="20" text-anchor="middle" letter-spacing="6">HARVEST KE LASS</text>
  </g>

  <!-- Pill Badge: KASI STREETWEAR • ZA -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="402" width="240" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="256" y="424" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3.5" fill="#38bdf8">KASI STREETWEAR • ZA</text>
  </g>
</svg>