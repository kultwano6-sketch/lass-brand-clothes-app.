<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LASS</title>
    <meta name="description" content="LASS – South African Kasi streetwear mobile shopping app featuring printed t-shirts, 2026 drops, secure in-app payments (Card, Capitec Pay, Instant EFT), and PAXI PEP delivery." />
    
    <!-- OpenGraph & Social -->
    <meta property="og:title" content="LASS" />
    <meta property="og:description" content="Harvest ke LASS – The only Kasi wear that drives the world insane. South African streetwear shopping app." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LASS" />
    <meta name="twitter:description" content="South African Kasi streetwear shopping app with WhatsApp ordering." />

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LASS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Font Preconnect: Syne & Plus Jakarta Sans for high-fashion streetwear feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-white antialiased min-h-screen selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Chunk reload recovery: if browser tries to load old cached chunk that was refreshed, reload once
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('dynamically imported module') !== -1 || e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('Failed to fetch') !== -1)) {
          if (!sessionStorage.getItem('lass_chunk_retry')) {
            sessionStorage.setItem('lass_chunk_retry', '1');
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            window.location.reload();
          }
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker management: only cache in production; unregister in preview to prevent stale chunk caching
      if ('serviceWorker' in navigator) {
        if (window.location.hostname.includes('.run.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              keys.forEach((k) => caches.delete(k));
            });
          }
        } else if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('SW registration skipped:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
